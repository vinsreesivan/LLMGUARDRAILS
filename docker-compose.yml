version: '3.8'

services:
  # NebulaGateAI Frontend - Web UI for managing Guardrails AI and NeMo Guardrails
  nebulagate-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebulagate-ui
    ports:
      - "3699:3699"
    environment:
      - NODE_ENV=production
      - GUARDRAILS_HOST=guardrails-server
      - GUARDRAILS_PORT=8000
      - NEMO_HOST=nemo-guardrails
      - NEMO_PORT=8001
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    restart: unless-stopped
    networks:
      - guardrails-network
    depends_on:
      - guardrails-server
      - nemo-guardrails
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3699"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Guardrails.AI Server - Validator-based guardrails with Hub integration
  guardrails-server:
    image: guardrailsai/guardrails:latest
    container_name: guardrails-server
    ports:
      - "8000:8000"
    environment:
      - GUARDRAILS_TOKEN=${GUARDRAILS_TOKEN}
      - GUARDRAILS_BASE_URL=${GUARDRAILS_BASE_URL:-https://api.guardrailsai.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - guardrails-data:/app/data
    restart: unless-stopped
    networks:
      - guardrails-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NeMo Guardrails Server - NVIDIA's programmable guardrails with NemoGuard
  nemo-guardrails:
    image: nvcr.io/nvidia/nemo/guardrails:latest
    container_name: nemo-guardrails
    ports:
      - "8001:8001"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Enable NemoGuard jailbreak detection
      - NEMO_JAILBREAK_DETECTION=true
      # Content safety moderation
      - NEMO_CONTENT_SAFETY=true
    volumes:
      - ./nemo-config.json:/app/config/config.json:ro
      - nemo-data:/app/data
    restart: unless-stopped
    networks:
      - guardrails-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/rails/configs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama - Local LLM runtime for privacy-focused deployments
  # Uncomment this service if you want to run local LLMs
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - guardrails-network
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  guardrails-network:
    driver: bridge

volumes:
  guardrails-data:
    driver: local
  nemo-data:
    driver: local
  ollama-data:
    driver: local
